<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/hk-logo.jpg" />

  <title>HK Technologies — Palestinian Software Studio | Apps, SaaS & AI</title>
  <meta name="description"
    content="HK Technologies is a Ramallah-based software studio building mobile apps, SaaS platforms and AI tools. Creators of Al Mohami legal AI, Jim Blue restaurant SaaS, and developer bootcamps." />
  <meta property="og:title" content="HK Technologies — Palestinian Software Studio" />
  <meta property="og:description"
    content="Mobile apps, SaaS platforms and AI products engineered in Ramallah. Al Mohami · Jim Blue · Aleppo · Bootcamps." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- ===================== NAVBAR ===================== -->
  <header class="navbar" id="navbar">
    <div class="container">
      <nav class="nav-inner">
        <a href="#top" class="brand">
          <div class="brand-logo"><img id="nav-logo" src="/assets/hk-logo.jpg" alt="HK Technologies" /></div>
          <div>
            <div class="brand-name" id="nav-brand-name">HK Technologies</div>
            <div class="brand-tag" id="nav-brand-tag">Build · Ship · Scale</div>
          </div>
        </a>

        <ul class="nav-links" id="nav-links"></ul>

        <a class="btn btn-primary nav-cta" id="nav-cta" href="#contact">Start a project <span aria-hidden>→</span></a>

        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </nav>

      <div class="mobile-menu" id="mobile-menu"></div>
    </div>
  </header>

  <span id="top"></span>

  <main>
    <!-- ===================== HERO ===================== -->
    <section class="hero">
      <img class="hero-bg" id="hero-bg" src="/assets/hero-bg.jpg" alt="" />
      <div class="hero-overlay"></div>
      <div class="hero-grid grid-bg"></div>
      <div class="hero-glow"></div>

      <div class="container hero-content">
        <div class="animate-fade-up">
          <div class="hero-badge glass"><span class="dot"></span><span id="hero-badge">Palestinian software studio · Est. 2025</span></div>
          <h1 id="hero-title"></h1>
          <p class="hero-sub" id="hero-sub"></p>
          <div class="hero-actions" id="hero-actions"></div>
          <dl class="hero-stats" id="hero-stats"></dl>
        </div>

        <div class="hero-visual">
          <div class="hero-visual-inner">
            <div class="blur-blob"></div>
            <img id="hero-image" src="/assets/hk-tech-hero.jpg" alt="HK Technologies" />
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== PRODUCTS ===================== -->
    <section class="section" id="products">
      <div class="section-glow"></div>
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" id="products-eyebrow">Our Work</p>
          <h2 id="products-title"></h2>
          <p id="products-sub"></p>
        </div>
        <div class="products-grid" id="products-grid"></div>
      </div>
    </section>

    <!-- ===================== SERVICES ===================== -->
    <section class="section bordered" id="services">
      <div class="container">
        <div class="services-layout">
          <div class="services-intro">
            <p class="eyebrow" id="services-eyebrow">What we do</p>
            <h2 id="services-title"></h2>
            <p id="services-sub"></p>
          </div>
          <div class="services-grid" id="services-grid"></div>
        </div>
      </div>
    </section>

    <!-- ===================== ABOUT ===================== -->
    <section class="section" id="about">
      <div class="section-glow"></div>
      <div class="container about-layout">
        <div class="about-text">
          <p class="eyebrow" id="about-eyebrow">About HK Technologies</p>
          <h2 id="about-title"></h2>
          <p id="about-p1"></p>
          <p id="about-p2"></p>
          <div class="about-stats" id="about-stats"></div>
        </div>
        <div>
          <div class="about-card">
            <div class="top-line"></div>
            <h3 id="about-steps-title">How we work</h3>
            <ol class="steps" id="about-steps"></ol>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== TESTIMONIALS ===================== -->
    <section class="section bordered" id="testimonials">
      <div class="container">
        <div class="section-head" style="margin-bottom:4rem">
          <p class="eyebrow" id="testimonials-eyebrow">Voices</p>
          <h2 id="testimonials-title"></h2>
        </div>
        <div class="testimonials-grid" id="testimonials-grid"></div>
      </div>
    </section>

    <!-- ===================== CONTACT ===================== -->
    <section class="section" id="contact">
      <div class="section-glow"></div>
      <div class="container">
        <div class="contact-card">
          <div class="contact-blob"></div>
          <div class="contact-grid">
            <div class="contact-text">
              <p class="eyebrow" id="contact-eyebrow">Let's build</p>
              <h2 id="contact-title"></h2>
              <p id="contact-sub"></p>
              <div class="contact-actions" id="contact-actions"></div>
            </div>
            <div>
              <div class="contact-info glass">
                <div class="head">
                  <div class="logo"><img id="contact-logo" src="/assets/hk-logo.jpg" alt="HK" /></div>
                  <div>
                    <div style="font-weight:600" id="contact-name">HK Technologies</div>
                    <div class="muted" style="font-size:0.75rem" id="contact-city">Ramallah · Palestine</div>
                  </div>
                </div>
                <dl id="contact-rows"></dl>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="copy" id="footer-copy"></div>
      <div class="footer-links" id="footer-links"></div>
    </div>
  </footer>

  <script src="/script.js"></script>
</body>

</html>
